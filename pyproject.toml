[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer_lab"
version = "0.1.0"
description = "Базовый Transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "pyarrow",  # parquet reader for pandas
    "tiktoken",
    "sentencepiece",  # Llama 2 tokenizer
    "huggingface_hub",
]

[project.optional-dependencies]
notebooks = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]